            select {

    #charlitosTable {
        width: 100%;

    #charlitosTable td {
        padding: 10px;

        border-bottom: 1px solid #ddd;
    }

    /* Archivo que vamos a respaldar */
    #charlitosTable .backup-row {
        background-color: #eaf2ff;
        font-weight: bold;
    }

    /* Espacio entre grupos de archivos */
    #charlitosTable .spacer-row td {
        height: 2px;
        padding: 0;
        border: none;
    }
    </style>
    <script>
	function addRowToTable(str1, str2, str3, conflicted) {
	  const tbody = document.querySelector('#charlitosTable tbody');
	  const fila = document.createElement('tr');
	  fila.innerHTML = `<td>${str1}</td><td>${str2}</td>`;
	  tbody.appendChild(fila);
	}
    </script>
    <script>
    function addRowToTable3(
    fileName,
    formattedPath,
    sizeAsStr,
    dateModifiedAsStr,
    index
) {
    const tbody = document.querySelector("#charlitosTable tbody");

    function getSelector(index) {
        return `
            <select data-backup-id="${index}" aria-label="Action" onchange="updateColor(this)">
                <option value="skip">Ignore</option>
                <option value="overwrite">Overwrite</option>
            </select>
        `;
    }

    function addTextCell(row, text) {
        const cell = document.createElement("td");
        cell.textContent = text ?? "";
        row.appendChild(cell);
        return cell;
    }

    // Primer renglón: archivo que se respaldará.
    const backupRow = document.createElement("tr");

    const nameCell = addTextCell(backupRow, fileName);
    nameCell.appendChild(document.createElement("br"));
    nameCell.appendChild(
        document.createTextNode(formattedPath ?? "")
    );

    addTextCell(backupRow, sizeAsStr);
    addTextCell(backupRow, dateModifiedAsStr);

    const actionCell = document.createElement("td");
    actionCell.innerHTML = getSelector(index);
    backupRow.appendChild(actionCell);

    tbody.appendChild(backupRow);
    } 
    
    </script>
    <script>
    function updateColor(selector) {
      selector.className = selector.value;
    }

    document.querySelectorAll('select').forEach(updateColor);
    </script>
    <script>
        function setAllActions(action) {
            const selects = document.querySelectorAll("#charlitosTable tbody select");

            selects.forEach(select => {
                select.value = action;
                updateColor(select);
            });
            }

    </script>
    <script>
        function restarWebViewSecondScreen() {
            const tbody = document.querySelector(`tbody`);
            tbody.innerHTML = "";
            }
    </script>
    <script>
        function getSelectedActions() {
            alert('testing 12...12...12');
            const selects = document.querySelectorAll(
                "#charlitosTable tbody select[data-backup-id]"
            );

            return Array.from(selects, select => ({
                index: Number(select.dataset.backupId),
                action: select.value
            }));
        }
    </script>

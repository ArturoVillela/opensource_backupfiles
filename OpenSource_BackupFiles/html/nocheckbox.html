<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>.....</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FFF;
            padding: 0px;
            margin: 0;
    	    padding: 1px;
            height: 100%;
        }

        .table-container {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin: 0;
    	    padding: 0;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #2f5597;
            color: white;
            text-align: left;
            padding: 12px 16px;
            font-size: 14px;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e5;
            font-size: 14px;
            color: #333;
        }

        tr:nth-child(even) {
            background-color: #f8f9fb;
        }

        tr:hover {
            background-color: #eaf1fb;
        }

        .column-description {
            width: 80%;
        }

        .column-short {
            width: 10%;
        }

        .column-check {
            width: 10%;
            text-align: center;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
    <script>
	function addRowToTable(str1, str2) {
	  const tbody = document.querySelector('#charlitosTable tbody');
	  const fila = document.createElement('tr');
	  fila.innerHTML = `<td>${str1}</td><td>${str2}</td>`;
	  tbody.appendChild(fila);
	}
    </script>
</head>
<body>

<div class="table-container">

    <table id="charlitosTable">
        <thead>
        <tr>
            <th class="column-description">File Path</th>
            <th class="column-short">Size</th>
        </tr>
        </thead>
        <tbody>
        </tbody></table>
</div>
</body>
</html>
